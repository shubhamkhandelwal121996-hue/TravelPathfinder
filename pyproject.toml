[project]
name = "travelpathfinder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shubham Khandelwal", email = "shubhamkhandelwal121996@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.10.23",
    "langchain-core>=1.0",
    "langchain-mcp-adapters>=0.3",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
    "mcp<2",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "requests>=2.34.2",
    "uv>=0.13.7",
]

[project.scripts]
travelpathfinder = "travelpathfinder:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
